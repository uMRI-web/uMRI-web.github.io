name: Build A2a abstract PDF
on:
  push:
    paths:
      - '.github/workflows/build-a2a-abstract-pdf.yml'
      - 'tract-viewer/tools/subject-viewer-builder/docs/a2a_abstract_20261009.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install WeasyPrint
        run: python -m pip install --upgrade weasyprint
      - name: Build PDF
        run: |
          mkdir -p out
          weasyprint tract-viewer/tools/subject-viewer-builder/docs/a2a_abstract_20261009.html out/20261009_A2a_FA-informed_atlas_deformation_学会抄録風まとめ.pdf
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: A2a_abstract_PDF_20261009
          path: out/20261009_A2a_FA-informed_atlas_deformation_学会抄録風まとめ.pdf
          if-no-files-found: error
