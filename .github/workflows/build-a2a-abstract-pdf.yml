name: Build A2a abstract PDF
on:
  push:
    paths:
      - '.github/workflows/build-a2a-abstract-pdf.yml'
      - 'tract-viewer/tools/subject-viewer-builder/docs/a2a_abstract_20261009.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install WeasyPrint
        run: python -m pip install --upgrade weasyprint
      - name: Build PDF
        run: |
          mkdir -p tract-viewer/tools/subject-viewer-builder/docs/generated
          weasyprint tract-viewer/tools/subject-viewer-builder/docs/a2a_abstract_20261009.html "tract-viewer/tools/subject-viewer-builder/docs/generated/20261009_A2a_FA-informed_atlas_deformation_学会抄録風まとめ.pdf"
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tract-viewer/tools/subject-viewer-builder/docs/generated/20261009_A2a_FA-informed_atlas_deformation_学会抄録風まとめ.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Generate A2a abstract PDF"
            git push
          fi
